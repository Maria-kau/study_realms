<div class="estrelas"></div>
    <div class="brilhos"></div>

    <!-- MAPA ISOMÉTRICO -->
    <div id="mapa">
        {% for building in construcoes %}
        <div class="building"
             data-tipo="{{building.tile.tipo}}"
             data-x="{{building.x}}"
             data-y="{{building.y}}"
             data-img="{{building.tile.imagem.url}}">
        </div>
        {% endfor %}
    </div>

    <!-- TIMER PRINCIPAL -->
    <div class="time-geral">
        <div class="timer-container">
            <h2>Temporizador de Estudo</h2>

            <!-- Exibição de rendimento estimado -->
            <div class="recompensa-preview" style="text-align: center; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; font-size: 14px;">
                <p>🌲 Rendimento: <strong>30 min = 1 Árvore</strong></p>
                <p>Estudo atual renderá: <strong id="estimativa-atual">1 Árvore(s)</strong></p>
            </div>

            <div class="form-row">
                <label>Tipo de atividade</label>
                <select id="tipo-select">
                    {% for key, label in tipos %}
                    <option value="{{key}}">{{label}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Duração (min)</label>
                <input id="duracao-input" type="number" min="1" value="30">
            </div>

            <!-- Elemento de áudio para a melodia (adicione sua melodia na pasta de áudios) -->
            <audio id="musica-estudo" loop>
                <source src="{% static 'audio/lofi.mp3' %}" type="audio/mpeg">
            </audio>

            <div class="form-row" style="display: flex; gap: 10px;">
                <button id="start-btn">Iniciar</button>
                <button id="pause-btn" style="background: linear-gradient(135deg, #6b7280, #4b5563); color: white; display: none;">Pausar</button>
                <!-- NOVO: BOTÃO DESISTIR -->
                <button id="cancel-btn" style="background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; display: none;">Desistir</button>
            </div>

            <div id="countdown">00:00</div>

            <!-- Formulário invisível de envio para o Django -->
            <form id="complete-form" method="post" action="{% url 'complete_study' %}">
                {% csrf_token %}
                <input type="hidden" name="tipo" id="form-tipo">
                <input type="hidden" name="duracao" id="form-duracao">
                <input type="hidden" name="concluida" id="form-concluida" value="nao">
            </form>

            <!-- Modal de Confirmação Final -->
            <div id="confirm-modal">
                <div class="modal-box">
                    <p>Você concluiu a atividade?</p>
                    <button id="confirm-yes">Sim</button>
                    <button id="confirm-no">Não</button>
                </div>
            </div>
        </div>
        <div class="contrucao">
            <ul>
                <li>
                    <img src="{% static 'img/icones/ico.arvore1.png' %}" alt="icone do acumulado de arvore">
                </li>
                <li>
                    <img src="{% static 'img/icones/ico-casas1.png' %}" alt="icone do acumulado de casa">
                </li>
                <li>
                    <img src="{% static 'img/icones/ico.especial1.png' %}" alt="icone do acumulado de especial">
                </li>
                <li>
                    <img src="{% static 'img/icones/ico.castelo1.png' %}" alt="icone do acumulado de castelo">
                </li>
            </ul>
        </div>
    </div>
