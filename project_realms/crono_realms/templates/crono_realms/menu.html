{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}RealMify{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'css/geral/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/geral/efeitos.css' %}">
    <link rel="stylesheet" href="{% static 'css/geral/separadores.css' %}">
    <link rel="stylesheet" href="{% static 'css/geral/conteiner.css' %}">
    <link rel="stylesheet" href="{% static 'css/geral/animacoes.css' %}">
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>

<body>

<nav class="menu conteiner3" id="menu">

    <div class="menu-top">

        <button id="btn-menu" class="btn-menu">
            <i class="bi bi-list"></i>
        </button>

        <div class="logo">

            <img src="{% static 'img/icones/ico-login1.png' %}" alt="Logo">

            <div class="logo-texto">
                <h2>RealMify</h2>
                <p>Seu reino do conhecimento</p>
            </div>

        </div>

    </div>

    <ul class="menu-links">

        <li>
            <a href="{% url 'home' %}">
                <i class="bi bi-house-door"></i>
                <span>Início</span>
            </a>
        </li>

        <li>
            <a href="{% url 'timer' %}">
                <i class="bi bi-alarm"></i>
                <span>Hora do estudo</span>
            </a>
        </li>

        <li>
            <a href="{% url 'to_list' %}">
                <i class="bi bi-card-checklist"></i>
                <span>To-List</span>
            </a>
        </li>

        <li>
            <a href="{% url 'biblioteca' %}">
                <i class="bi bi-book"></i>
                <span>Biblioteca</span>
            </a>
        </li>


        <li>
            <a href="{% url 'perfil' %}">
                <i class="bi bi-person-circle"></i>
                <span>Perfil</span>
            </a>
        </li>

    </ul>
    <div class="menu-bottom">

        <a href="{% url 'logout' %}" class="logout">

            <i class="bi bi-box-arrow-right"></i>

            <span>Sair</span>

        </a>

    </div>
</nav>

<main class="conteudo">

{% block content %}
{% endblock %}

</main>

<script src="{% static 'js/menu.js' %}"></script>

{% block js %}
{% endblock %}

</body>
</html>
